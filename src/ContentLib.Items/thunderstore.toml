[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "LC_ContentLib"
name = "ContentLib.Items"
description = "Items module of ContentLib."
websiteUrl = "https://github.com/lc-contentlib/contentlib"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
icon = "../../icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/ContentLib/release/com.github.LC-ContentLib.Items.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "lethal-company", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/lethal-company/category/
peak = [ "libraries", "mods", "bepinex", ]
